name: Main Branch CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    uses: halos-org/shared-workflows/.github/workflows/build-release.yml@main
    with:
      package-name: skip-freeboard-panel
      package-description: 'Signal K server plugin registering Skip as a Freeboard-SK plotter-extension panel and widgets.'
      build-deb: false
