name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    uses: halos-org/shared-workflows/.github/workflows/checks.yml@feat/v1-pr-checks

  never-runs:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: true

  # Branch protection requires only this job. List every other job in needs,
  # including jobs defined in this file.
  status:
    needs: [checks, never-runs]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
